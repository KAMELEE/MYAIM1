name: iOS Build & Run

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate 2>&1 | tee gen.log

      - name: Diagnostics
        run: |
          { echo "Xcode:"; xcodebuild -version; echo; \
            echo "--- xcodebuild -list ---"; \
            xcodebuild -project MYAIM.xcodeproj -list; } 2>&1 | tee diag.log

      - name: Build (iOS Simulator)
        run: |
          set +e
          xcodebuild \
            -project MYAIM.xcodeproj \
            -scheme MYAIM \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log
          code=${PIPESTATUS[0]}
          echo "$code" > build.code
          exit 0

      - name: Publish CI log to repo (readable without sign-in)
        if: always()
        run: |
          mkdir -p ci-logs
          {
            echo "# CI log — run ${{ github.run_number }}"
            echo "exit code: $(cat build.code 2>/dev/null || echo '?')"
            echo; echo "===== xcodegen ====="; cat gen.log 2>/dev/null
            echo; echo "===== diagnostics ====="; cat diag.log 2>/dev/null
            echo; echo "===== errors ====="
            grep -nE "error:|warning:.*error|does not contain|Unable to|cannot find|No such|fatal" xcodebuild.log 2>/dev/null | head -80
            echo; echo "===== build tail (120) ====="; tail -120 xcodebuild.log 2>/dev/null
          } > ci-logs/latest.txt
          git config user.name "ci-bot"
          git config user.email "ci@myaim.app"
          git add ci-logs/latest.txt
          git commit -m "CI logs run ${{ github.run_number }} [skip ci]" || echo "no changes"
          git push || echo "push failed"

      - name: Fail if build failed
        if: always()
        run: |
          code=$(cat build.code 2>/dev/null || echo 1)
          echo "build exit code: $code"
          test "$code" = "0"

      - name: Launch in simulator & capture screenshot
        if: success()
        continue-on-error: true
        run: |
          RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS[^ ]*' | tail -1)
          DEVICE=$(xcrun simctl create "myaim" "iPhone 15" "$RUNTIME")
          xcrun simctl boot "$DEVICE"; sleep 5
          APP=$(find build/Build/Products -name "MYAIM.app" -type d | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.myaim.app
          sleep 10
          xcrun simctl io "$DEVICE" screenshot screenshot.png

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myaim-screenshot
          path: screenshot.png
          if-no-files-found: ignore
