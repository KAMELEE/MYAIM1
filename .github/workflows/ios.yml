name: iOS Build & Run

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Diagnostics
        run: |
          echo "## Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          { echo "PWD: $(pwd)"; ls -la; echo "---- xcodebuild -list ----"; \
            xcodebuild -project MYAIM.xcodeproj -list; } 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build (iOS Simulator)
        run: |
          set +e
          xcodebuild \
            -project MYAIM.xcodeproj \
            -scheme MYAIM \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log
          code=${PIPESTATUS[0]}
          echo "## Build result: exit $code" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -nE "error:|does not contain|Unable to|cannot|No such" xcodebuild.log | head -60 >> $GITHUB_STEP_SUMMARY
          echo "---- tail ----" >> $GITHUB_STEP_SUMMARY
          tail -40 xcodebuild.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $code

      - name: Launch in simulator & capture screenshot
        continue-on-error: true
        run: |
          RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS[^ ]*' | tail -1)
          DEVICE=$(xcrun simctl create "myaim" "iPhone 15" "$RUNTIME")
          xcrun simctl boot "$DEVICE"
          sleep 5
          APP=$(find build/Build/Products -name "MYAIM.app" -type d | head -1)
          echo "App: $APP"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.myaim.app
          sleep 10
          xcrun simctl io "$DEVICE" screenshot screenshot.png
          echo "Captured screenshot."

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myaim-screenshot
          path: screenshot.png
          if-no-files-found: ignore
