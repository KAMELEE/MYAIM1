name: iOS Build & Run

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project MYAIM.xcodeproj \
            -target MYAIM \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Launch in simulator & capture screenshot
        continue-on-error: true
        run: |
          RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS[^ ]*' | tail -1)
          DEVICE=$(xcrun simctl create "myaim" "iPhone 15" "$RUNTIME")
          xcrun simctl boot "$DEVICE"
          sleep 5
          APP=$(find build/Build/Products -name "MYAIM.app" -type d | head -1)
          echo "App: $APP"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.myaim.app
          sleep 10
          xcrun simctl io "$DEVICE" screenshot screenshot.png
          echo "Captured screenshot."

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myaim-screenshot
          path: screenshot.png
          if-no-files-found: ignore
