name: iOS Build & Run

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode (16.x for project format 77)
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=/Applications/Xcode.app
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate 2>&1 | tee gen.log

      - name: Diagnostics
        run: |
          { echo "Xcode:"; xcodebuild -version; echo; \
            echo "--- xcodebuild -list ---"; \
            xcodebuild -project MYAIM.xcodeproj -list; } 2>&1 | tee diag.log

      - name: Build (iOS Simulator)
        run: |
          set +e
          xcodebuild \
            -project MYAIM.xcodeproj \
            -scheme MYAIM \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log
          code=${PIPESTATUS[0]}
          echo "$code" > build.code
          exit 0

      - name: Launch in simulator & capture screenshot
        continue-on-error: true
        run: |
          set -x
          [ "$(cat build.code)" = "0" ] || { echo "build failed; skipping" | tee sim.log; exit 0; }
          xcrun simctl list devices available > devices.txt
          DEVICE=$(grep -ioE '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}' devices.txt | head -1)
          { echo "DEVICE=$DEVICE"; } | tee sim.log
          xcrun simctl boot "$DEVICE" 2>&1 | tee -a sim.log || true
          xcrun simctl bootstatus "$DEVICE" 2>&1 | tee -a sim.log || true
          APP=$(find build/Build/Products -name "MYAIM.app" -type d | head -1)
          echo "APP=$APP" | tee -a sim.log
          xcrun simctl install "$DEVICE" "$APP" 2>&1 | tee -a sim.log
          xcrun simctl launch "$DEVICE" com.myaim.app -demoMode 2>&1 | tee -a sim.log
          sleep 14
          xcrun simctl io "$DEVICE" screenshot screenshot.png 2>&1 | tee -a sim.log
          ls -la screenshot.png 2>&1 | tee -a sim.log

      - name: Publish CI log + screenshot to repo (readable without sign-in)
        if: always()
        run: |
          mkdir -p ci-logs
          {
            echo "# CI log — run ${{ github.run_number }}"
            echo "exit code: $(cat build.code 2>/dev/null || echo '?')"
            echo; echo "===== xcodegen ====="; cat gen.log 2>/dev/null
            echo; echo "===== diagnostics ====="; cat diag.log 2>/dev/null
            echo; echo "===== errors ====="
            grep -nE "error:|warning:.*error|does not contain|Unable to|cannot find|No such|fatal" xcodebuild.log 2>/dev/null | head -80
            echo; echo "===== build tail (80) ====="; tail -80 xcodebuild.log 2>/dev/null
            echo; echo "===== simulator ====="; cat sim.log 2>/dev/null
          } > ci-logs/latest.txt
          [ -f screenshot.png ] && cp screenshot.png ci-logs/screenshot.png || true
          cp sim.log ci-logs/sim.txt 2>/dev/null || true
          # capture last crash report if any
          find ~/Library/Logs/DiagnosticReports -name 'MYAIM*' -newermt '-10 minutes' 2>/dev/null \
            -exec sh -c 'echo "=== $1 ==="; tail -80 "$1"' _ {} \; > ci-logs/crash.txt 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci@myaim.app"
          git add -A ci-logs
          git commit -m "CI logs run ${{ github.run_number }} [skip ci]" || echo "no changes"
          git push || echo "push failed"

      - name: Fail if build failed
        if: always()
        run: |
          code=$(cat build.code 2>/dev/null || echo 1)
          echo "build exit code: $code"
          test "$code" = "0"
