name: iOS Build & Run

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode (16.x for project format 77)
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=/Applications/Xcode.app
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate 2>&1 | tee gen.log

      - name: Diagnostics
        run: |
          { echo "Xcode:"; xcodebuild -version; echo; \
            echo "--- xcodebuild -list ---"; \
            xcodebuild -project MYAIM.xcodeproj -list; } 2>&1 | tee diag.log

      - name: Build (iOS Simulator)
        run: |
          set +e
          xcodebuild \
            -project MYAIM.xcodeproj \
            -scheme MYAIM \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            DEMO_FLAG=DEMO \
            build 2>&1 | tee xcodebuild.log
          code=${PIPESTATUS[0]}
          echo "$code" > build.code
          exit 0

      - name: Launch in simulator & capture screenshot
        continue-on-error: true
        run: |
          set -x
          [ "$(cat build.code)" = "0" ] || { echo "build failed; skipping" | tee sim.log; exit 0; }
          xcrun simctl list devices available > devices.txt
          DEVICE=$(grep -ioE '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}' devices.txt | head -1)
          { echo "DEVICE=$DEVICE"; } | tee sim.log
          xcrun simctl boot "$DEVICE" 2>&1 | tee -a sim.log || true
          xcrun simctl bootstatus "$DEVICE" 2>&1 | tee -a sim.log || true
          APP=$(find build/Build/Products -name "MYAIM.app" -type d | head -1)
          echo "APP=$APP" | tee -a sim.log
          xcrun simctl install "$DEVICE" "$APP" 2>&1 | tee -a sim.log
          for T in home discover goals bookings profile; do
            for KV in "top 0.0" "mid 0.5" "bot 1.0"; do
              set -- $KV; K=$1; V=$2
              xcrun simctl terminate "$DEVICE" com.myaim.app 2>/dev/null || true
              xcrun simctl launch "$DEVICE" com.myaim.app -demoMode -demoTab "$T" -scrollTo "$V" 2>&1 | tee -a sim.log
              sleep 5
              xcrun simctl io "$DEVICE" screenshot "shot-$T-$K.png" 2>&1 | tee -a sim.log
            done
          done
          # Provider (academy) interface — top of each tab
          for T in dashboard courses posts subscription account; do
            xcrun simctl terminate "$DEVICE" com.myaim.app 2>/dev/null || true
            xcrun simctl launch "$DEVICE" com.myaim.app -demoMode -providerMode -demoTab "$T" -scrollTo 0.0 2>&1 | tee -a sim.log
            sleep 5
            xcrun simctl io "$DEVICE" screenshot "shot-prov-$T.png" 2>&1 | tee -a sim.log
          done
          # Trainee pushed pages
          for R in serviceDetail booking search favorites notifications goalDetail registerAcademy providerProfile settings messages chat; do
            xcrun simctl terminate "$DEVICE" com.myaim.app 2>/dev/null || true
            xcrun simctl launch "$DEVICE" com.myaim.app -demoMode -demoRoute "$R" 2>&1 | tee -a sim.log
            sleep 5
            xcrun simctl io "$DEVICE" screenshot "shot-page-$R.png" 2>&1 | tee -a sim.log
          done
          # Provider pushed pages
          for R in addCourse publishPost courseDetail; do
            xcrun simctl terminate "$DEVICE" com.myaim.app 2>/dev/null || true
            xcrun simctl launch "$DEVICE" com.myaim.app -demoMode -providerMode -demoRoute "$R" 2>&1 | tee -a sim.log
            sleep 5
            xcrun simctl io "$DEVICE" screenshot "shot-page-$R.png" 2>&1 | tee -a sim.log
          done
          # Onboarding (fresh launch) + Login
          xcrun simctl terminate "$DEVICE" com.myaim.app 2>/dev/null || true
          xcrun simctl launch "$DEVICE" com.myaim.app -onboarding 2>&1 | tee -a sim.log
          sleep 5; xcrun simctl io "$DEVICE" screenshot "shot-onboarding.png" 2>&1 | tee -a sim.log
          xcrun simctl terminate "$DEVICE" com.myaim.app 2>/dev/null || true
          xcrun simctl launch "$DEVICE" com.myaim.app -authScreen 2>&1 | tee -a sim.log
          sleep 5; xcrun simctl io "$DEVICE" screenshot "shot-login.png" 2>&1 | tee -a sim.log
          # Auth flows end-to-end (demo auth in DEMO builds):
          # 1) login → main app      2) register → OTP screen      3) register + OTP → main app
          for A in "autoLogin shot-auth-login" "autoRegister shot-auth-otp" "autoRegisterOtp shot-auth-done"; do
            set -- $A; FLAG=$1; SHOT=$2
            xcrun simctl terminate "$DEVICE" com.myaim.app 2>/dev/null || true
            ARGS="-authScreen -$FLAG"
            [ "$FLAG" = "autoRegisterOtp" ] && ARGS="-authScreen -autoRegister -autoOTP"
            xcrun simctl launch "$DEVICE" com.myaim.app $ARGS 2>&1 | tee -a sim.log
            sleep 8; xcrun simctl io "$DEVICE" screenshot "$SHOT.png" 2>&1 | tee -a sim.log
          done

          cp shot-home-top.png screenshot.png 2>/dev/null || true
          ls -la shot-*.png 2>&1 | tee -a sim.log

      - name: Upload to Appetize (interactive simulator in the browser)
        if: always()
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_TOKEN }}
        run: |
          mkdir -p ci-logs
          if [ "$(cat build.code 2>/dev/null)" != "0" ]; then exit 0; fi
          if [ -z "$APPETIZE_TOKEN" ]; then
            echo "لتفعيل المعاينة التفاعلية على محاكي حقيقي: أنشئ حساب Appetize.io مجانًا، ثم أضف مفتاح API كـ Secret باسم APPETIZE_TOKEN في إعدادات المستودع (Settings ▸ Secrets ▸ Actions). عند البناء التالي سيظهر الرابط هنا." > ci-logs/appetize.txt
            exit 0
          fi
          APP=$(find build/Build/Products -name "MYAIM.app" -type d | head -1)
          ( cd "$(dirname "$APP")" && zip -r -q /tmp/MYAIM.zip "$(basename "$APP")" )
          resp=$(curl -s -H "X-API-KEY: $APPETIZE_TOKEN" -F "file=@/tmp/MYAIM.zip" -F "platform=ios" https://api.appetize.io/v1/apps)
          echo "$resp" > ci-logs/appetize-raw.json
          key=$(echo "$resp" | grep -oE '"publicKey" *: *"[^"]+"' | head -1 | sed -E 's/.*"publicKey" *: *"([^"]+)".*/\1/')
          if [ -n "$key" ]; then
            echo "https://appetize.io/app/$key?device=iphone15pro&osVersion=17.5&scale=75" > ci-logs/appetize.txt
            echo "Appetize URL: https://appetize.io/app/$key"
          else
            echo "فشل رفع Appetize — الاستجابة في appetize-raw.json" > ci-logs/appetize.txt
          fi

      - name: Publish CI log + screenshot to repo (readable without sign-in)
        if: always()
        run: |
          mkdir -p ci-logs
          {
            echo "# CI log — run ${{ github.run_number }}"
            echo "exit code: $(cat build.code 2>/dev/null || echo '?')"
            echo; echo "===== xcodegen ====="; cat gen.log 2>/dev/null
            echo; echo "===== diagnostics ====="; cat diag.log 2>/dev/null
            echo; echo "===== errors ====="
            grep -nE "error:|warning:.*error|does not contain|Unable to|cannot find|No such|fatal" xcodebuild.log 2>/dev/null | head -80
            echo; echo "===== build tail (80) ====="; tail -80 xcodebuild.log 2>/dev/null
            echo; echo "===== simulator ====="; cat sim.log 2>/dev/null
          } > ci-logs/latest.txt
          [ -f screenshot.png ] && cp screenshot.png ci-logs/screenshot.png || true
          cp shot-*.png ci-logs/ 2>/dev/null || true
          cp sim.log ci-logs/sim.txt 2>/dev/null || true
          # capture last crash report if any
          find ~/Library/Logs/DiagnosticReports -name 'MYAIM*' -newermt '-10 minutes' 2>/dev/null \
            -exec sh -c 'echo "=== $1 ==="; tail -80 "$1"' _ {} \; > ci-logs/crash.txt 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci@myaim.app"
          git add -A ci-logs
          git commit -m "CI logs run ${{ github.run_number }} [skip ci]" || echo "no changes"
          git push || echo "push failed"

      - name: Fail if build failed
        if: always()
        run: |
          code=$(cat build.code 2>/dev/null || echo 1)
          echo "build exit code: $code"
          test "$code" = "0"

# trigger Appetize upload
