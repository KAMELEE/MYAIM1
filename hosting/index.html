<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ماي إيم — MY AIM</title>
<style>
  :root { --brand:#5B3FBF; --ink:#1A1A2E; --muted:#5b5b6b; --bg:#ffffff; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  .card { text-align:center; padding:40px 24px; }
  .logo { width:72px; height:72px; border-radius:20px; background:var(--brand); color:#fff;
          display:grid; place-items:center; font-weight:800; font-size:28px; margin:0 auto 16px; }
  h1 { margin:0 0 6px; }
  p { color:var(--muted); margin:0 0 24px; }
  a { display:inline-block; margin:6px; padding:12px 22px; border-radius:12px;
      background:var(--brand); color:#fff; text-decoration:none; font-weight:600; }
  a.ghost { background:transparent; color:var(--brand); border:1px solid var(--brand); }
  @media (prefers-color-scheme: dark){ :root{ --ink:#f3f3f7; --muted:#b4b4c2; --bg:#14141f; } }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">MA</div>
    <h1>ماي إيم — MY AIM</h1>
    <p>منصّتك لاكتشاف الأكاديميات والمدرّبين وتحقيق أهدافك.</p>
    <a href="/privacy">سياسة الخصوصية</a>
    <a class="ghost" href="/terms">الشروط والأحكام</a>
  </div>
</body>
</html>
