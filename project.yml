# MY AIM — XcodeGen project spec
#
# Fastest way to open in Xcode on a Mac:
#   1. brew install xcodegen   (once)
#   2. cd into this folder, run:  xcodegen generate
#   3. open MYAIM.xcodeproj
#
# (Manual alternative without XcodeGen is documented in README.md)

name: MYAIM
options:
  bundleIdPrefix: com.myaim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # <- put your Apple Developer Team ID here
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"     # iPhone only
    ENABLE_PREVIEWS: YES

targets:
  MYAIM:
    type: application
    platform: iOS
    sources:
      - path: MYAIM
        excludes:
          - "**/*.md"          # doc READMEs must not be bundled (name collisions)
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myaim.app
        # Use the hand-authored Info.plist (custom fonts, permissions, RTL).
        # No `info:` block here on purpose, so XcodeGen does NOT overwrite it.
        INFOPLIST_FILE: MYAIM/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
      configs:
        # CI (Appetize) builds pass DEMO_FLAG=DEMO to xcodebuild → demo auth.
        # Local Xcode builds leave it undefined → real Firebase auth.
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG $(DEMO_FLAG)"
    scheme:
      testTargets: []
